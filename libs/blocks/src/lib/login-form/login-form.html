<form
  [formGroup]="form"
  (ngSubmit)="submit()"
  class="flex w-full max-w-sm flex-col gap-4 rounded-xl border bg-card p-6 text-card-foreground shadow-sm"
>
  <h2 class="text-lg font-semibold">{{ heading() }}</h2>

  <label class="flex flex-col gap-1.5 text-sm font-medium">
    Email
    <input
      z-input
      type="email"
      formControlName="email"
      autocomplete="email"
      placeholder="you@example.com"
    />
  </label>

  <label class="flex flex-col gap-1.5 text-sm font-medium">
    Password
    <input
      z-input
      type="password"
      formControlName="password"
      autocomplete="current-password"
    />
  </label>

  <button z-button type="submit" [zLoading]="loading()">
    {{ submitLabel() }}
  </button>
</form>
