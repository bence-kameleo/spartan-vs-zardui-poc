<form
  [formGroup]="form"
  (ngSubmit)="submit()"
  class="flex w-full max-w-sm flex-col gap-4 rounded-xl border bg-card p-6 text-card-foreground shadow-sm"
>
  <h2 class="text-lg font-semibold">{{ heading() }}</h2>

  <div class="flex flex-col gap-1.5">
    <label hlmLabel for="spartan-login-email">Email</label>
    <input
      hlmInput
      id="spartan-login-email"
      type="email"
      formControlName="email"
      autocomplete="email"
      placeholder="you@example.com"
    />
  </div>

  <div class="flex flex-col gap-1.5">
    <label hlmLabel for="spartan-login-password">Password</label>
    <input
      hlmInput
      id="spartan-login-password"
      type="password"
      formControlName="password"
      autocomplete="current-password"
    />
  </div>

  <button hlmBtn type="submit" [disabled]="loading()">
    {{ submitLabel() }}
  </button>
</form>
